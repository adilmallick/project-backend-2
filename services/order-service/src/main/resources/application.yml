server:
  # DECISION: Dedicated port 8083 for order-service.
  port: 8083

spring:
  application:
    name: order-service

  # ===========================================================================
  # Concurrency & Runtime (Virtual Threads)
  # ===========================================================================
  threads:
    virtual:
      # DECISION: Java 21 Virtual Threads enabled.
      # SEE: ADR-002
      enabled: true

  # ===========================================================================
  # Relational Database (Database-per-Service: order_db)
  # ===========================================================================
  datasource:
    # INVARIANT: order-service connects ONLY to order_db.
    # SEE: ADR-001
    url: jdbc:postgresql://localhost:5432/order_db
    username: delivery_user
    password: delivery_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: OrderHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===========================================================================
  # JPA & Hibernate
  # ===========================================================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

  # ===========================================================================
  # Flyway Migrations
  # ===========================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # ===========================================================================
  # Distributed Cache & Idempotency Store (Redis 7)
  # ===========================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

  # ===========================================================================
  # Event-Driven Messaging (Apache Kafka 3.7 / KRaft)
  # ===========================================================================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: order-service-group
      auto-offset-reset: earliest

# =============================================================================
# Stage 5: Resilience4j Circuit Breaker & Retry Configuration
# =============================================================================
resilience4j:
  circuitbreaker:
    instances:
      catalogService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5000ms
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      catalogService:
        max-attempts: 2
        wait-duration: 100ms

# =============================================================================
# Stage 5: Actuator, Prometheus Metrics & Distributed Tracing
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# =============================================================================
# Logging with OpenTelemetry Trace IDs & Correlation IDs
# =============================================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-} spanId=%X{spanId:-} correlationId=%X{correlationId:-}] - %msg%n"
  level:
    com.swiggy.order: DEBUG
    com.swiggy.common: DEBUG
    org.springframework.web: INFO
