server:
  # DECISION: Dedicated port 8081 for user-service to avoid local port collisions across microservices.
  port: 8081

spring:
  application:
    name: user-service

  # ===========================================================================
  # Concurrency & Runtime (Virtual Threads)
  # ===========================================================================
  threads:
    virtual:
      # DECISION: Enable Java 21 Virtual Threads for all incoming Tomcat HTTP requests.
      # SEE: ADR-002
      enabled: true

  # ===========================================================================
  # Relational Database (Database-per-Service: user_db)
  # ===========================================================================
  datasource:
    # SIMPLIFICATION: Default credentials for local development. Overridden via ENV in staging/prod.
    # INVARIANT: user-service connects ONLY to user_db, never catalog_db or order_db.
    # SEE: ADR-001
    url: jdbc:postgresql://localhost:5432/user_db
    username: delivery_user
    password: delivery_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: UserHikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===========================================================================
  # JPA & Hibernate
  # ===========================================================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 25

  # ===========================================================================
  # Flyway Migrations
  # ===========================================================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # ===========================================================================
  # In-Memory Cache & Distributed State (Redis 7)
  # ===========================================================================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 2000ms

# =============================================================================
# Security & JWT Configuration
# =============================================================================
security:
  jwt:
    # SIMPLIFICATION: Hardcoded 256-bit HMAC key for local dev. In production, loaded via AWS Secrets Manager.
    # INVARIANT: Secret key must be at least 256 bits (32 bytes) for HMAC-SHA256 cryptographic security.
    # SEE: ADR-003
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    # DECISION: 15-minute access token lifespan limits exposure if a token is intercepted.
    # TRADE-OFF: Requires token refresh or re-login after 15 minutes.
    expiration-minutes: 15

# =============================================================================
# Logging with Correlation IDs
# =============================================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId:-}] - %msg%n"
  level:
    com.swiggy.user: DEBUG
    com.swiggy.common: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
