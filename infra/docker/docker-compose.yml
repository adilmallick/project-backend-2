# DECISION: Docker Compose provides local isolated infrastructure supporting our microservices architecture.
# ALTERNATIVES: Manually installing and managing local postgres instances.
# SEE: ADR-001

services:
  postgres:
    # DECISION: PostgreSQL 16 Alpine for low memory footprint and high query planner efficiency.
    image: postgres:16-alpine
    container_name: delivery-postgres
    restart: unless-stopped
    environment:
      # SIMPLIFICATION: Standard local dev credentials. In production / AWS, credentials are drawn from AWS Secrets Manager.
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery_pass
      POSTGRES_DB: postgres
      # DECISION: Enforces database-per-service isolation for user, catalog, and order services.
      # SEE: ADR-001
      POSTGRES_MULTIPLE_DATABASES: "user_db,catalog_db,order_db"
    ports:
      # DECISION: PostgreSQL standard port 5432 exposed to host for IDE and CLI inspection.
      - "5432:5432"
    volumes:
      # DECISION: Managed Docker volume persists data between container restarts.
      - postgres_data:/var/lib/postgresql/data
      # DECISION: Mount init script to automatically create isolated microservice databases on first start.
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # DECISION: Redis 7 Alpine for in-memory caching, distributed rate limiting, and geospatial indexing.
    # SEE: ADR-006, ADR-007
    image: redis:7-alpine
    container_name: delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  kafka:
    # DECISION: Apache Kafka with KRaft mode eliminating Zookeeper dependency.
    # SEE: ADR-008
    image: confluentinc/cp-kafka:7.6.1
    container_name: delivery-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
