# DECISION: Automated continuous integration pipeline executes on every push and PR
# to guarantee that no broken contracts, compilation failures, or failing Testcontainers tests land on main.
# SEE: ADR-001

name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test Microservices
    # DECISION: Standard Ubuntu latest runner provided by GitHub.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        # DECISION: Eclipse Temurin JDK 21 LTS matches our local runtime and target production containers.
        # SEE: ADR-002
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        # DECISION: Official Gradle setup action caches dependencies and wrapper artifacts, cutting build times by ~60%.
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile and Run All Microservice Tests
        # DECISION: Runs all unit and Testcontainers integration tests across libs:common, user-service, catalog-service, order-service.
        # Docker is pre-installed on ubuntu-latest runners, allowing Testcontainers to spin up real PostgreSQL containers seamlessly.
        run: ./gradlew test
